site_name: AI Development Tools & Configurations
site_description: Centralized repository for AI tools, agents, and configurations to streamline AI-assisted development workflows
site_author: CowboyLogic
site_url: https://cowboylogic.github.io/ai-dev

# Repository
repo_name: CowboyLogic/ai-dev
repo_url: https://github.com/CowboyLogic/ai-dev
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 CowboyLogic

# Configuration
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - toc.follow
  language: en
  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - toc:
      permalink: true
      title: On this page

# Plugins
plugins:
  - callouts:
      aliases: false
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CowboyLogic
  generator: false

# Page tree
nav:
  - Home: index.md
  - Agents:
      - Overview: agents/index.md
      - Lane Topology: agents/lane-topology.md
      - Matrix Topology: agents/matrix-topology.md
  - Skills:
      - Overview: skills/index.md
      - About-Me Skill Creator: skills/about-me-skill-creator.md
      - Google Style Docs: skills/google-style-docs.md
      - Git Commit Messages: skills/git-commit-messages.md
      - Docker Image Management: skills/docker-image-management.md
      - MkDocs Site Management: skills/mkdocs-site-management.md
      - Markdownlint Validator: skills/markdownlint-validator.md
      - Copilot Agent Creator: skills/agent-creator-copilot.md
      - Copilot Instruction Creator: skills/copilot-instruction-creator.md
      - Claude Code Agent Creator: skills/agent-creator-claudecode.md
      - OpenCode Agent Creator: skills/agent-creator-opencode.md
      - Codex Agent Creator: skills/agent-creator-codex.md
      - Claude Code Settings Manager: skills/client-config-claudecode.md
      - Codex Configuration Manager: skills/client-config-codex.md
      - Copilot CLI Configuration Manager: skills/client-config-copilotcli.md
      - OpenCode Configuration Manager: skills/client-config-opencode.md
      - Copilot Worker: skills/copilot-worker.md
  - Harness:
      - Overview: harness/index.md
      - OpenCode:
          - Overview: harness/opencode/index.md
          - Configuration Guide: harness/opencode/configuration.md
      - Visual Studio Code:
          - Overview: harness/vscode/README.md
          - Quick Start: harness/vscode/quick-start.md
          - Markdown-Based Agents: harness/vscode/markdown-agents.md
          - Programmatic SubAgents: harness/vscode/subagent-tool.md
          - Agent Examples: harness/vscode/agent-examples.md
          - Best Practices: harness/vscode/best-practices.md
          - Troubleshooting: harness/vscode/troubleshooting.md
      - Claude Code:
          - Overview: harness/claudecode/index.md
          - Vertex AI: harness/claudecode/claudecode-vertexai.md
  - MCP Servers: mcp/index.md
  - Contributing: contributing.md
  - About: about.md

# Extra CSS
extra_css:
  - stylesheets/extra.css
