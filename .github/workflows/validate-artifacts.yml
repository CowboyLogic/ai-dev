name: Validate artifacts and documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install pyyaml mkdocs-material mkdocs-callouts

      - name: Validate Lane Topology
        run: python agents/lane-topology/validate.py

      - name: Validate Matrix manifest
        run: bash agents/matrix-topology/verify-deployment.sh

      - name: Test copilot-worker against its pinned SDK
        env:
          REQUIRE_SDK_CONTRACT: "1"
        run: |
          pip install uv
          # Install exactly what the script header pins, so this runs the environment users get.
          python - > "$RUNNER_TEMP/copilot-worker-requirements.txt" <<'PY'
          import pathlib, re
          header = pathlib.Path("skills/copilot-worker/scripts/copilot_worker.py").read_text().split("# ///", 2)[1]
          print("\n".join(re.findall(r'^#\s+"([^"]+)",?$', header, re.MULTILINE)))
          PY
          uv run --no-project --with-requirements "$RUNNER_TEMP/copilot-worker-requirements.txt" \
            python -m unittest discover -s skills/copilot-worker/scripts -v

      - name: Test skill-router
        run: python -m unittest discover -s skills/skill-router/scripts -v

      - name: Test the artifact synchronization validator
        run: python -m unittest discover -s scripts -v

      - name: Validate artifact documentation synchronization
        run: python scripts/validate_artifact_sync.py

      - name: Build documentation
        run: mkdocs build --clean --strict

  copilot-worker-windows:
    # The supervisor's job object, the PowerShell tool set, and Windows path handling run
    # only on Windows.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Test copilot-worker against its pinned SDK
        shell: bash
        env:
          REQUIRE_SDK_CONTRACT: "1"
        run: |
          pip install uv
          python - > "$RUNNER_TEMP/copilot-worker-requirements.txt" <<'PY'
          import pathlib, re
          header = pathlib.Path("skills/copilot-worker/scripts/copilot_worker.py").read_text().split("# ///", 2)[1]
          print("\n".join(re.findall(r'^#\s+"([^"]+)",?$', header, re.MULTILINE)))
          PY
          uv run --no-project --with-requirements "$RUNNER_TEMP/copilot-worker-requirements.txt" \
            python -m unittest discover -s skills/copilot-worker/scripts -v

      - name: Test skill-router
        run: python -m unittest discover -s skills/skill-router/scripts -v
